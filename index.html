<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Screen Test">
<meta name="theme-color" content="#07030f">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<title>Screen Test</title>
<style>
  :root{
    --bg:#07030f; --mag:#ff2bd6; --cyan:#19f3ff; --yel:#ffe94d;
    --grn:#39ff7a; --org:#ff9e2c; --red:#e8566a;
    --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
    /* layout knobs */
    --banner:64px;      /* banner height below the status bar */
    --barh:56px;        /* bottom menu bar height */
    --barGap:10px;      /* space kept under the bar (home-bar area) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* full-screen method: page height = 100vh, everything in page flow */
  html,body{height:100vh;background:var(--bg);color:#fff;overflow:hidden;
    font:20px/1.2 'VT323',ui-monospace,monospace;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent}
  #screen{position:absolute;top:0;left:0;width:100%;height:100vh;overflow:hidden}
  .ov{position:absolute;pointer-events:none;z-index:5}

  /* ---------- three areas ---------- */
  #layout{position:absolute;inset:0;display:flex;flex-direction:column;
    padding-top:var(--sat);padding-bottom:var(--barGap)}
  #banner{flex:none;height:var(--banner);display:flex;align-items:center;justify-content:center;
    border:2px dashed var(--mag);background:rgba(255,43,214,.08);position:relative}
  #banner h1{font:16px 'Press Start 2P',monospace;color:#fff;
    text-shadow:0 0 6px var(--mag),0 0 14px var(--mag)}
  #game{flex:1;min-height:0;border:2px dashed var(--cyan);background:rgba(25,243,255,.05);
    position:relative;display:flex;align-items:center;justify-content:center}
  #bar{flex:none;height:var(--barh);display:grid;grid-template-columns:1fr 1fr 1fr;
    align-items:center;justify-items:center;border:2px dashed var(--yel);
    background:rgba(255,233,77,.07);position:relative}
  #bar button{font:10px 'Press Start 2P',monospace;padding:6px 10px;width:96px;height:36px;
    background:transparent;border:2px solid;border-radius:6px;pointer-events:auto}
  #bRules{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 8px rgba(25,243,255,.5)}
  #bMenu{color:var(--bg);background:var(--yel)!important;border-color:var(--yel);box-shadow:0 0 10px var(--yel)}
  #bSet{color:var(--mag);border-color:var(--mag);box-shadow:0 0 8px rgba(255,43,214,.5)}
  .tag{position:absolute;right:6px;top:3px;font-size:16px;line-height:1;pointer-events:none}
  #banner .tag{color:var(--mag)} #game .tag{color:var(--cyan)} #bar .tag{color:var(--yel);top:-15px}

  /* ---------- screen overlays ---------- */
  #edge{inset:0;border:2px solid var(--cyan);border-radius:47.33px;opacity:.7}
  #sTop{top:0;left:0;right:0;height:var(--sat);
    background:repeating-linear-gradient(45deg,rgba(255,233,77,.22) 0 6px,transparent 6px 12px)}
  #sBot{bottom:0;left:0;right:0;height:var(--sab);
    background:repeating-linear-gradient(45deg,rgba(255,158,44,.22) 0 6px,transparent 6px 12px)}
  #notch{top:0;left:50%;width:210px;height:30px;transform:translateX(-50%);
    border:2px solid var(--mag);border-top:none;border-radius:0 0 22px 22px;opacity:.7}
  #home{bottom:8px;left:50%;width:134px;height:5px;transform:translateX(-50%);
    background:var(--mag);border-radius:3px;opacity:.8}

  /* info panel inside the game area */
  #info{width:300px;padding:10px 14px;background:rgba(7,3,15,.9);
    border:2px solid var(--cyan);border-radius:10px;font-size:19px}
  #info h2{font:11px 'Press Start 2P',monospace;color:var(--yel);margin-bottom:8px}
  #info table{width:100%;border-collapse:collapse}
  #info td:last-child{text-align:right}
  .ok{color:var(--grn)} .bad{color:var(--red)} .dim{color:#9a8fb0}
  .sw{display:inline-block;width:10px;height:10px;margin-right:6px;border:2px dashed}
  #hint{margin-top:6px;font-size:16px;color:#9a8fb0;text-align:center}
  body.hide #info{visibility:hidden}
  #probe{position:absolute;visibility:hidden;padding:var(--sat) 0 var(--sab) 0}
</style>
</head>
<body>
<div id="screen">
  <div id="layout">
    <div id="banner"><span class="tag" id="tBanner"></span><h1>NEON ARCADE</h1></div>
    <div id="game"><span class="tag" id="tGame"></span>
      <div id="info">
        <h2>SCREEN TEST · AREAS</h2>
        <table id="tbl"></table>
        <div id="hint">Tap to hide/show this panel</div>
      </div>
    </div>
    <div id="bar"><span class="tag" id="tBar"></span>
      <button id="bRules">RULES</button><button id="bMenu">MENU</button><button id="bSet">SETTINGS</button>
    </div>
  </div>
  <div id="sTop" class="ov"></div><div id="sBot" class="ov"></div>
  <div id="notch" class="ov"></div><div id="home" class="ov"></div>
  <div id="edge" class="ov"></div>
  <div id="probe"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const sa=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
function sz(el){const r=el.getBoundingClientRect();return [Math.round(r.width),Math.round(r.height),Math.round(r.top),Math.round(r.bottom)]}
function row(n,v,g){return `<tr><td class="dim">${n}</td><td class="${g===undefined?'':(g?'ok':'bad')}">${v}</td></tr>`}
function update(){
  const cs=getComputedStyle($('probe'));
  const t=Math.round(parseFloat(cs.paddingTop)),b=Math.round(parseFloat(cs.paddingBottom));
  const s=sz($('screen')),bn=sz($('banner')),g=sz($('game')),br=sz($('bar'));
  $('tBanner').textContent=`${bn[0]}×${bn[1]}`;
  $('tGame').textContent=`${g[0]}×${g[1]}`;
  $('tBar').textContent=`${br[0]}×${br[1]}`;
  $('tbl').innerHTML=
    row('Home-screen app',sa?'yes':'no',sa)+
    row('Screen',`${s[0]} × ${s[1]}`,s[0]===390&&s[1]===844)+
    row('Safe top / bottom',`${t} / ${b}`)+
    row('<span class="sw" style="border-color:var(--mag)"></span>Banner',`${bn[1]} (y ${bn[2]}–${bn[3]})`)+
    row('<span class="sw" style="border-color:var(--cyan)"></span>Game area',`${g[0]}×${g[1]} (y ${g[2]}–${g[3]})`)+
    row('<span class="sw" style="border-color:var(--yel)"></span>Menu bar',`${br[1]} (y ${br[2]}–${br[3]})`)+
    row('Gap under bar',`${s[1]-br[3]}`);
}
addEventListener('resize',update);
addEventListener('orientationchange',()=>setTimeout(update,300));
document.addEventListener('click',e=>{if(!e.target.closest('button'))document.body.classList.toggle('hide')});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.fonts&&document.fonts.ready.then(update);
update();setTimeout(update,500);
</script>
</body>
</html>
